<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joint</title>
<script>
  // Theme choisi (reglage commun aux applis), applique avant l'affichage
  try { const t = localStorage.getItem("outils-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<meta name="description" content="Espace à laisser entre deux éléments (dilatation thermique)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='8' width='7' height='8' fill='%230B7285'/%3E%3Crect x='15' y='8' width='7' height='8' fill='%230B7285'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css?v=2.9">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <!-- Logo : deux elements et l'espace entre eux -->
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
        <rect x="1.5" y="6" width="7" height="10" fill="var(--joint)"/>
        <rect x="13.5" y="6" width="7" height="10" fill="var(--joint)"/>
        <path d="M9.5 11h3M10.8 9.2L9.5 11l1.3 1.8M11.2 9.2l1.3 1.8-1.3 1.8" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <details class="apps" id="appsMenu">
        <summary aria-label="Changer d'application"><h1 class="app-name">Joint</h1>
          <svg class="chev" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </summary>
        <div class="apps-menu" id="appsList"></div>
      </details>
    </div>
    <span class="tagline">Dilatation : quel espace laisser, de combien ça bouge</span>
    <button class="pill" id="themeBtn" title="Changer de thème"></button>
  </div>
</header>

<main>
  <section class="card" aria-labelledby="hPiece">
    <h2 id="hPiece">Ma pièce</h2>
    <div class="srow">
      <div class="sel" id="sMat"><button type="button" class="sel-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Matériau de la pièce"><span class="sw"></span><span class="sel-t"></span><svg class="chev" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="sel-pop hidden" role="listbox" aria-label="Matériau de la pièce"></div></div>
      <div class="unit" data-u="mm"><input id="sLong" inputmode="decimal" autocomplete="off" aria-label="Longueur de la pièce"><span class="u" aria-hidden="true"></span></div>
    </div>
    <span class="lbl slbl" id="sAmbLbl">Où est-elle posée ?</span>
    <div class="seg" id="sAmb" role="radiogroup" aria-labelledby="sAmbLbl"></div>
    <p class="hint" id="sHyp"></p>
  </section>

  <section class="card result sresult" aria-live="polite">
    <div class="result-top">
      <span class="kicker">Elle dilate de</span>
      <div class="big" id="sDil">—</div>
      <div class="sdraw" id="sDraw" aria-hidden="true"></div>
      <div class="sjoint">
        <span class="kicker">Joint à prévoir entre deux pièces</span>
        <div class="big" id="sJoint">—</div>
        <p class="why" id="sWhy"></p>
      </div>
    </div>
  </section>

  <section class="card" aria-labelledby="hTrou">
    <h2 id="hTrou">Si la pièce est vissée : trou oblong</h2>
    <div class="reg">
      <label class="lbl" for="sReg">Réglage de pose voulu, de chaque côté (facultatif)</label>
      <div class="unit" data-u="mm"><input id="sReg" inputmode="decimal" autocomplete="off" placeholder="ex. 20"><span class="u" aria-hidden="true"></span></div>
    </div>
    <div class="trou-res">
      <div class="big" id="sTrou">—</div>
      <div class="slot" id="sSlot" aria-hidden="true"></div>
      <p class="hint" id="sTrouWhy"></p>
    </div>
  </section>

  <div class="actions"><button type="button" class="btn" id="sCopy">Copier le résumé</button></div>
</main>

<footer>Joint v2.9 · <button type="button" id="aboutBtn">Conçu par Hugo N.</button> · 2026 · <a href="https://outils-hn.github.io/?app=Joint&amp;v=2.9&amp;page=%2FJoint%2F" target="_blank" rel="noopener noreferrer">Suggestion / bug</a></footer>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="js/app.js?v=2.9"></script>
</body>
</html>
